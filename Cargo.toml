[package]
name = "sit"
version = "0.3.0"
edition = "2024"
description = "Structured interactive git: pick files, choose a commit type, compose formatted commits from the terminal"
homepage = "https://github.com/notenderdreams/sit"
repository = "https://github.com/notenderdreams/sit"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "2"
crossterm = "0.25"
dirs = "6"
inquire = "0.7"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
unicode-width = "0.1"
toml = { version = "0.8", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
portable-pty = "0.8"


[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
